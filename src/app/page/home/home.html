<div class="hero-container">
    <!-- Glowing Background Effects -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div class="hero-grid">
        <!-- Left Side: Intro Content -->
        <div class="hero-content">
            <div class="badge-tag">
                <span class="badge-dot"></span> Available for Freelance & Full-time
            </div>

            <h1 class="hero-title">
                Creative <span class="gradient-text">{{ currentRole }}</span><span class="cursor">|</span>
            </h1>

            <p class="hero-subtitle">
                I build high-performance, modern, and interactive web applications using
                <strong class="highlight">Angular</strong>, TypeScript, and modern CSS.
            </p>

            <div class="cta-group">
                <a routerLink="/projects" class="btn-primary">
                    View My Work <span class="arrow">→</span>
                </a>
                <a routerLink="/contact" class="btn-secondary">
                    Get In Touch
                </a>
            </div>

            <!-- Quick Stats Card Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>1+</h3>
                    <p>Years Experience</p>
                </div>
                <div class="stat-card">
                    <h3>10+</h3>
                    <p>Projects Completed</p>
                </div>
                <div class="stat-card">
                    <h3>100%</h3>
                    <p>Client Satisfaction</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Profile Picture with Glowing Effect -->
        <div class="hero-image-container">
            <div class="image-wrapper">
                <img src="profile.jpg" alt="Gul Zaman" class="profile-img">
                <div class="img-glow"></div>
            </div>
        </div>
    </div>
</div>
